[package]
name = "backsave-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "=1.0.104"
axum = "=0.8.9"
chrono = { version = "=0.4.45", features = ["serde"] }
getrandom = "=0.4.3"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tokio = { version = "=1.54.1", features = ["process", "time", "macros", "rt-multi-thread", "io-util", "fs"] }
tokio-util = "=0.7.20"
http-body-util = "=0.1.5"
tower-http = { version = "=0.7.1", default-features = false, features = ["fs"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["fmt", "ansi"] }

[dev-dependencies]
tempfile = "=3.27.0"
tower = { version = "=0.5.3", features = ["util"] }
futures-util = "=0.3.34"
