# Run from the repository root:
#   BACKSAVE_DOMAIN=example.org docker compose -f deploy/docker-compose.yml up -d --build
# Without BACKSAVE_DOMAIN the site is served on https://localhost (self-signed certificate).

services:
  server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    # Forwards stop signals to the server and reaps engine processes.
    init: true
    environment:
      # Only Caddy can reach the server, so its X-Forwarded-For is trusted.
      BACKSAVE_TRUST_PROXY: "true"
      # Optional: honor the header only from these peers (IPs or CIDRs), e.g. the compose network.
      # BACKSAVE_TRUSTED_PROXIES: "172.16.0.0/12"
      # BACKSAVE_DISK_BUDGET_GIB: "100"
    volumes:
      - data:/data
      # To use the real conversion engine instead of the bundled stub, mount it read-only:
      # - ./engine/backsave-engine:/app/engine:ro
    expose:
      - "8080"

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "80:80"
      - "443:443"
    environment:
      BACKSAVE_DOMAIN: ${BACKSAVE_DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  data:
  caddy_data:
  caddy_config:
